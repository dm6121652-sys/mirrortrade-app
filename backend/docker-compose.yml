services:
  api:
    build: .
    command: npm run start:dev
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mirrortrade
      POSTGRES_USER: mirrortrade
      POSTGRES_PASSWORD: mirrortrade_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirrortrade -d mirrortrade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
